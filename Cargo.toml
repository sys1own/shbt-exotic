[package]
name = "shbt_exotic"
version = "2.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]
resolver = "2"
members = ["crates/*"]

[features]
extension-module = ["pyo3/extension-module"]
default = []

[dependencies]
pyo3 = { version = "0.23" }
rug = { version = "1.24", features = ["serde"] }
gmp-mpfr-sys = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
exotic-core-cft = { path = "crates/exotic-core-cft" }
exotic-warp-adm = { path = "crates/exotic-warp-adm" }
exotic-ghost-gravity = { path = "crates/exotic-ghost-gravity" }
exotic-translocation = { path = "crates/exotic-translocation" }
exotic-stasis-thermo = { path = "crates/exotic-stasis-thermo" }
exotic-lanr-thermo = { path = "crates/exotic-lanr-thermo" }
exotic-comms-telemetry = { path = "crates/exotic-comms-telemetry" }
exotic-hil-microkernel = { path = "crates/exotic-hil-microkernel" }
exotic-uq-montecarlo = { path = "crates/exotic-uq-montecarlo" }
exotic-eda-cad = { path = "crates/exotic-eda-cad" }

exotic-extended-audit = { path = "crates/exotic-extended-audit" }
